# Manoir de la Champagne — déploiement VPS (Dokploy)
#
# Dokploy : rattacher le domaine au service « site », port 3000.
# Les variables d'environnement se saisissent dans l'onglet Environment (voir .env.example).
#
# Sans Dokploy : retirer la section networks ci-dessous (ou créer le réseau :
# docker network create dokploy-network), puis voir le README.
services:
  site:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    # Port interne joint par Traefik. Rien n'est publié sur l'hôte.
    expose:
      - "3000"
    volumes:
      # Base SQLite + photos envoyées depuis l'admin. À sauvegarder.
      - manoir-data:/data
    networks:
      - dokploy-network

networks:
  # Réseau de Traefik (Dokploy) : sans lui, le proxy répond « Bad Gateway ».
  dokploy-network:
    external: true

volumes:
  manoir-data:
